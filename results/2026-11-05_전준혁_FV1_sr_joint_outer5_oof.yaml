design: folds_v1 반복 0의 fold 0~4를 바깥 평가 쪽으로 차례로 두고, 바깥 학습 쪽만으로 공동 SR(sr_joint_search 정식 설정, niterations 500·populations 31·population_size 27·deterministic·serial, 시드 42~51)을 탐색, 안쪽 4 fold 1-표준오차(SE = sd/√4)로 f 선택, 바깥 학습 쪽 전체 재적합 후 평가 쪽 채점. 비교: 같은 변수의 테이블별 선형회귀. fold 0은 기존 탐색 재사용
eval_label_influence: 후보 14개(정식 SR 후보 합집합)는 전체 train+val 라벨로 선정 → 평가 fold 라벨이 후보 선택에 영향. 척도(|중앙값|)·fold 배정·교체 구간은 라벨 미사용. 이번 추가 검증 자체가 기존 결과를 본 뒤 결정됨
