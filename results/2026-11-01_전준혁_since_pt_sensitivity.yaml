date: 2026-11-01
author: 전준혁
script: src/since_reset_check.py
purpose: since_POLISH_TABLE_w 오류가 #6~#8 결과에 주는 영향 (민감도, 기존 결과는 그대로 둠)
input: data/processed/features_v1.csv + wafer_table.csv (MRR, t_start; train+val, is_outlier=0), folds_v1.csv
featuresets:
  F-free: features_v1 113개 (기존 결과와 같음, 재실행 값이 #8 기존 결과와 일치함을 확인)
  F-free-noSincePT: 113개에서 since_POLISH_TABLE_w만 뺀 112개 (값을 고치거나 새 피처를 만들지 않음)
model: XGBRegressor(n_estimators=400, max_depth=4, learning_rate=0.03, subsample=0.8, colsample_bytree=0.8, min_child_weight=3, objective='reg:squarederror', tree_method='hist', random_state=42, n_jobs=4) (3.2절 고정값, n_jobs 4)
analyses: split_vs_pooled(#8, A-123 평가), pooled_xgb(#6 기본 모델, 그룹별), source456_cv(#7 S1·S2 전체 피처)
test: 보정 t-검정, 차이 = noSincePT − F-free (MSE). 분리 대 통합은 피처셋별로 #8과 같은 규칙
output_summary: 2026-11-01_전준혁_since_pt_sensitivity_summary.csv (kind = cv_mean / noSincePT_minus_full / split_vs_pooled / source_importance_and_shift / importance_full_data)
result:
  split_vs_pooled: F-free 차이 없음(분리 유지) (p = 0.712), F-free-noSincePT 차이 없음(분리 유지) (p = 0.874)
  split_vs_pooled_verdict_stable: True
labels: train+val만. 소스 예측 변화에는 A-123 라벨 미사용. test·data/locked/ 사용 안 함

