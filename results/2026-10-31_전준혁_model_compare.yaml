date: 2026-10-31
author: 전준혁
script: src/model_compare.py
preregistration: v0.2.1 3.2절 (#15 비교군, #16 고정 하이퍼파라미터)
input: data/processed/features_v1.csv (F-free 113) + wafer_table.csv (MRR, train+val, is_outlier=0)
folds: data/processed/folds_v1.csv 25 fold (repeat 0~4, 시드 42~46), cv_common.iter_folds 누수 점검
featureset: F-free+cat = F-free 113개 + 범주형 group·STAGE (one-hot 또는 CatBoost 범주형)
design: 세 그룹 통합 학습 1개 모델, 평가는 전체(all)와 그룹별
models:
  xgb+onehot: XGBRegressor(n_estimators=400, max_depth=4, learning_rate=0.03, subsample=0.8, colsample_bytree=0.8, min_child_weight=3, objective='reg:squarederror', tree_method='hist', random_state=42, n_jobs=4)
  catboost+native: CatBoostRegressor(iterations=600, depth=4, learning_rate=0.05, random_seed=42, verbose=False, allow_writing_files=False, thread_count=4, cat_features=['group', 'STAGE'])
  catboost+onehot: CatBoostRegressor(iterations=600, depth=4, learning_rate=0.05, random_seed=42, verbose=False, allow_writing_files=False, thread_count=4)
  rf+onehot: RandomForestRegressor(max_features=1.0, random_state=42, n_jobs=4)  # n_estimators=100 기본값
  lr+onehot: SimpleImputer(median) → StandardScaler → LinearRegression() (학습 쪽 기준)
categorical_levels: group [A-456, B-456, A-123], STAGE [A, B] (고정 목록 one-hot)
missing: xgb·catboost·rf 자체 처리, lr만 학습 쪽 중앙값 대체 + 학습 쪽 표준화
tuning: 없음
seed: 42
tests: 보정 t-검정(Nadeau & Bengio), 지표 MSE, 차이 = model_a − model_b, 비율 = fold별 n_eval/n_train 평균 (참고용, 선택 규칙 없음)
labels: train+val만. test·data/locked/ 사용 안 함
runtime_sec: {'xgb+onehot': 33.6, 'catboost+native': 4402.0, 'catboost+onehot': 59.5, 'rf+onehot': 54.6, 'lr+onehot': 1.5}
summary_rmse_mean:
  - {model: catboost+native, group: A-123, rmse: 3.687}
  - {model: catboost+native, group: A-456, rmse: 3.427}
  - {model: catboost+native, group: B-456, rmse: 3.344}
  - {model: catboost+native, group: all, rmse: 3.451}
  - {model: catboost+onehot, group: A-123, rmse: 3.565}
  - {model: catboost+onehot, group: A-456, rmse: 3.307}
  - {model: catboost+onehot, group: B-456, rmse: 3.281}
  - {model: catboost+onehot, group: all, rmse: 3.351}
  - {model: lr+onehot, group: A-123, rmse: 6.337}
  - {model: lr+onehot, group: A-456, rmse: 9.065}
  - {model: lr+onehot, group: B-456, rmse: 44.784}
  - {model: lr+onehot, group: all, rmse: 31.842}
  - {model: rf+onehot, group: A-123, rmse: 2.653}
  - {model: rf+onehot, group: A-456, rmse: 3.277}
  - {model: rf+onehot, group: B-456, rmse: 3.397}
  - {model: rf+onehot, group: all, rmse: 3.229}
  - {model: xgb+onehot, group: A-123, rmse: 2.714}
